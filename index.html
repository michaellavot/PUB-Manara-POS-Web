v><button class="button" id="guest">פתח מסך אורחים בחלון נוסף</button><p id="connection">ממתין למסך אורחים</p><div class="customer-strip"><input class="field" id="client" list="clients" placeholder="חפש לקוח"><datalist id="clients"><option>לקוח ניסיון א</option><option>לקוח ניסיון ב</option></datalist><button class="button" id="self">חיוב עצמי</button><button class="button charge" id="issue">חיוב</button></div><p id="issued"></p><h3 id="tableTitle">תור השירים</h3><div class="bill-table-wrap"><table class="bill-table"><thead><tr><th>שם הלקוח</th><th>שם השיר</th><th>סטטוס השיר</th></tr></thead><tbody id="rows"></tbody></table></div><button class="button" id="history">היסטוריית הזמנות</button></section></section><dialog id="detail"><h3>פרטי הזמנה</h3><div id="detailBody"></div><button class="button" onclick="this.closest('dialog').close()">סגור</button></dialog><dialog id="settings"><h3>הגדרות</h3><button class="button" id="musicInside">מוזיקת רקע</button><button class="button" id="pause">השהה / המשך</button><button class="button" onclick="this.closest('dialog').close()">סגור</button></dialog><dialog id="music"><h3>מוזיקת רקע</h3><input class="field" id="video" placeholder="YouTube ID או קישור"><select id="kind"><option value="mix">מיקס</option><option value="regular">רגיל</option></select><button class="button" id="addBg">הוסף</button><button class="button" onclick="this.closest('dialog').close()">סגור</button></dialog></div><script src="guest-engine.js"></script><script src="integration.js"></script></html>
